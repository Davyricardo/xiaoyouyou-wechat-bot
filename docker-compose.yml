services:
  wechat:
    # 带群 @ mention 字段的镜像分支
    image: dandan310/agent-wechat:0.12.0-mentions.6
    container_name: splatoon-wechat-test
    restart: unless-stopped
    shm_size: 1gb
    ports:
      # 只绑回环，不对外暴露
      - "127.0.0.1:6174:6174"
      - "127.0.0.1:1234:1234"
    environment:
      - AGENT_WECHAT_TOKEN=${AGENT_WECHAT_TOKEN:?需要设置 AGENT_WECHAT_TOKEN}
      - TZ=Asia/Shanghai
    volumes:
      - wechat-home:/home/wechat
      - wechat-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: Bearer $$AGENT_WECHAT_TOKEN' http://127.0.0.1:6174/api/status >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  wechat-home:
  wechat-data:
